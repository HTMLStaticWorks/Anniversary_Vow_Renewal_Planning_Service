<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowed | Create Client Account</title>
    <meta name="description" content="Register your private celebration account with Vowed.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .auth-divider-badge {
            background: rgba(20, 17, 19, 0.85) !important;
            color: rgba(255, 255, 255, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
        }

        .auth-social-btn {
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.75) !important;
            background: rgba(255, 255, 255, 0.02) !important;
        }

        .auth-social-btn i {
            color: #ffffff !important;
        }

        body:not(.dark-mode) .auth-divider-badge {
            background: rgba(255, 255, 255, 0.92) !important;
            color: rgba(17, 17, 17, 0.72) !important;
            border-color: rgba(17, 17, 17, 0.14);
        }

        body:not(.dark-mode) .auth-social-btn {
            color: #111111 !important;
            border-color: rgba(17, 17, 17, 0.3) !important;
            background: rgba(255, 255, 255, 0.55) !important;
        }

        body:not(.dark-mode) .auth-social-btn i {
            color: #111111 !important;
        }

        .auth-link {
            color: var(--electric-gold) !important;
        }

        body:not(.dark-mode) .auth-link {
            color: #912A3E !important;
            font-weight: bold;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23171315'/%3E%3Cpath d='M32 46s-14-9.5-14-19a9 9 0 0 1 15-6.7A9 9 0 0 1 48 27c0 9.5-14 19-14 19z' fill='%23D4AF37'/%3E%3C/svg%3E">
</head>
<body class="dark-mode hero-section" style="background: url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=1920&q=80') no-repeat center center/cover;">

    <div class="hero-overlay" style="background: rgba(20, 17, 19, 0.85);"></div>
    <div class="glow-orb orb-2" style="background: var(--dusty-rose);"></div>
    
    <!-- Top Nav Minimal -->
    <nav class="navbar navbar-expand-lg fixed-top py-3" style="z-index: 10;">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-uppercase fw-bold d-flex align-items-center" href="index.html" style="font-family: var(--font-heading); font-size: 1.3rem; letter-spacing: 2px;">
                <i class="fa-solid fa-heart me-2" style="color: var(--electric-gold);"></i>
                <span style="color: var(--electric-gold);">VOW</span>ED
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a href="#" id="theme-toggle" class="nav-link p-0 fs-5"><i class="fa-solid fa-moon"></i></a>
                <a href="#" id="rtl-toggle" class="nav-link p-0 fw-bold" style="font-size: 0.9rem;">RTL</a>
            </div>
        </div>
    </nav>

    <div class="container position-relative z-2">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh; padding-top: 80px; padding-bottom: 40px;">
            <div class="col-md-8 col-lg-6 fade-up">
                <div class="glass-card p-4 p-md-5">
                    <div class="text-center">
                        <a class="navbar-brand text-uppercase fw-bold d-inline-block mb-3" href="index.html" style="font-family: var(--font-heading); font-size: 1.6rem; letter-spacing: 2px; color: white;">
                            <i class="fa-solid fa-heart me-2" style="color: var(--electric-gold);"></i>
                            <span style="color: var(--electric-gold);">VOW</span>ED
                        </a>
                        <h2 class="mb-2" style="font-family: var(--font-heading);">Create Celebration Account</h2>
                        <p class="text-muted mb-4 small">Track your planning milestones, budget, and design selections.</p>
                    </div>
                    
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6 text-start">
                                <label class="form-label text-muted small">Partner One</label>
                                <input type="text" class="form-control bg-transparent border-secondary shadow-none" placeholder="Eleanor">
                            </div>
                            <div class="col-md-6 text-start">
                                <label class="form-label text-muted small">Partner Two</label>
                                <input type="text" class="form-control bg-transparent border-secondary shadow-none" placeholder="Marcus">
                            </div>
                            <div class="col-12 text-start">
                                <label class="form-label text-muted small">Email Address</label>
                                <input type="email" class="form-control bg-transparent border-secondary shadow-none" placeholder="couple@example.com">
                            </div>
                            <div class="col-12 text-start position-relative">
                                <label class="form-label text-muted small">Create Password</label>
                                <input type="password" class="form-control bg-transparent border-secondary shadow-none" placeholder="********">
                            </div>
                            <div class="col-12">
                                <div class="form-check text-start">
                                    <input class="form-check-input bg-transparent border-secondary shadow-none" type="checkbox" id="terms">
                                    <label class="form-check-label text-muted small" for="terms">
                                        I agree to the <a href="#" class="auth-link">Terms of Service</a> &amp; Privacy Policy
                                    </label>
                                </div>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-premium w-100 py-2">Create Account</button>
                            </div>
                        </div>
                        
                        <div class="position-relative my-4">
                            <hr class="border-secondary">
                            <span class="position-absolute top-50 start-50 translate-middle px-2 small text-muted auth-divider-badge">OR</span>
                        </div>
                        
                        <div class="d-flex gap-2 justify-content-center mb-4">
                            <button type="button" class="btn btn-outline-light w-100 auth-social-btn"><i class="fa-brands fa-google me-2"></i> Google</button>
                            <button type="button" class="btn btn-outline-light w-100 auth-social-btn"><i class="fa-brands fa-apple me-2"></i> Apple</button>
                        </div>
                        
                        <p class="text-center text-muted small mb-0">Already registered? <a href="login.html" class="text-decoration-none fw-bold auth-link">Sign In</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button type="button" id="backToTop" class="back-to-top" aria-label="Back to top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
